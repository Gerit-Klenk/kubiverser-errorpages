apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubiverse-error-pages
  namespace: traefik
  labels:
    app.kubernetes.io/name: kubiverse-error-pages
    app.kubernetes.io/part-of: kubiverse-portal
    app.kubernetes.io/component: error-pages
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubiverse-error-pages
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubiverse-error-pages
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: error-pages
          # Ersetze dieses Image mit deiner Container-Registry (z. B. ghcr.io/<org>/kubiverse-error-pages:latest)
          # Für eine Bereitstellung ohne eigenes Docker-Image siehe 'configmap-deployment.yaml'!
          image: kubiverse-error-pages:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
