# ==============================================================================
# ZERO-IMAGE-BUILD DEPLOYMENT
# Mit dieser Datei kannst du die Kubiverse-Fehlerseiten direkt in Kubernetes deployen,
# OHNE vorher ein eigenes Docker-Image bauen oder in eine Registry pushen zu müssen!
# Verwendet das offizielle nginx-unprivileged Image und mountet die Seiten via ConfigMap.
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: kubiverse-error-pages-config
  namespace: traefik
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp_path;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
        server_tokens off;
        sendfile on;

        server {
            listen 8080;
            listen [::]:8080;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "healthy\n";
            }

            location / {
                try_files $uri $uri/ /index.html;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubiverse-error-pages
  namespace: traefik
  labels:
    app.kubernetes.io/name: kubiverse-error-pages
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubiverse-error-pages
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubiverse-error-pages
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: error-pages
          image: nginxinc/nginx-unprivileged:alpine-slim
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: html-pages
              mountPath: /usr/share/nginx/html
      volumes:
        - name: nginx-config
          configMap:
            name: kubiverse-error-pages-config
        - name: html-pages
          configMap:
            name: kubiverse-error-pages-html
---
apiVersion: v1
kind: Service
metadata:
  name: kubiverse-error-pages
  namespace: traefik
  labels:
    app.kubernetes.io/name: kubiverse-error-pages
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: kubiverse-error-pages
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kubiverse-error-pages
  namespace: traefik
spec:
  errors:
    status:
      - "400-599"
    service:
      name: kubiverse-error-pages
      port: 80
    query: "/{status}.html"
